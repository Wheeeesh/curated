  <g transform="translate(131 98) scale(8.333)">
    <path
      d="M15 37C15 37 28 22.5 28 13.5C28 6 22 1 15 1C8 1 2 6 2 13.5C2 22.5 15 37 15 37Z"
      fill="#ffffff"/>
    <circle cx="15" cy="13.5" r="4.5" fill="#1c1c1e"/>
  </g>
</svg>
